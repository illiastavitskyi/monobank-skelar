<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monogent Pro Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0e; --phone: #16161a; --surface: #1f1f24; --border: #2d2d34;
            --text: #ffffff; --muted: #a1a1aa;
            --accent: #00ffa3; --fast: #00d1ff; --max: #ffb800; --red: #ff4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; overflow-x: auto; }
        
        /* Глобальний контейнер для трьох телефонів */
        .main-wrapper { display: flex; gap: 20px; padding-bottom: 40px; }

        /* Стиль корпусу телефону */
        .phone-frame { width: 360px; height: 780px; background: var(--phone); border-radius: 48px; border: 10px solid #222; box-shadow: 0 40px 80px rgba(0,0,0,0.6); position: relative; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; transition: all 0.4s ease; }
        
        /* Стан: прихований телефон */
        .phone-frame.hidden { opacity: 0; transform: translateX(50px); pointer-events: none; width: 0; margin: 0; border: none; }

        /* Dynamic Island */
        .island { width: 100px; height: 26px; background: #000; border-radius: 20px; margin: 10px auto 0; z-index: 10; position: relative;}

        /* Екран */
        .screen { flex: 1; padding: 20px; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; }
        .screen::-webkit-scrollbar { display: none; }

        /* Типографіка */
        .app-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 4px; letter-spacing: -1px; }
        .app-sub { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; }
        .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: block; }

        /* Елементи інтерфейсу */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        textarea, select { width: 100%; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 14px; outline: none; resize: none; line-height: 1.5; }
        textarea { height: 60px; }
        select { background: var(--surface); border: 1px solid var(--border); padding: 10px; border-radius: 10px; cursor: pointer; -webkit-appearance: none; appearance: none; margin-bottom: 10px;}

        .drop-zone { border: 1px dashed var(--border); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; margin-bottom: 12px; }
        .drop-zone:hover { border-color: var(--accent); background: rgba(0,255,163,0.05); }
        .dz-text { font-size: 11px; color: var(--muted); }
        .dz-text span { color: var(--accent); font-weight: 600; }
        .preview-img { width: 100%; height: 120px; border-radius: 12px; object-fit: cover; margin-top: 10px; border: 1px solid var(--border); }

        .btn { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 18px; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-top: auto; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.3; }

        /* Результати */
        .base-price { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: #fff; text-align: center; margin: 10px 0; }
        .final-price { font-family: 'Syne', sans-serif; font-size: 48px; font-weight: 800; color: var(--accent); text-align: center; letter-spacing: -2px; margin: 15px 0; }
        
        .vision-res { border-left: 3px solid var(--accent); padding-left: 12px; }
        .vision-score { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--accent); }
        .vision-reason { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

        .strat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px; text-align: center; flex: 1; }
        .strat-name { font-size: 8px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
        .strat-val { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800; }

        .analog-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; }
        .analog-p { color: var(--accent); font-weight: 600; }

        /* Анімації завантаження */
        .loader { display: flex; justify-content: center; gap: 4px; padding: 20px 0; }
        .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 0.5s infinite alternate; }
        .dot:nth-child(2) { animation-delay: 0.1s; }
        .dot:nth-child(3) { animation-delay: 0.2s; }
        @keyframes bounce { to { transform: translateY(-8px); opacity: 0.3; } }
        .fade { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="phone-frame" id="phone1">
        <div class="island"></div>
        <div class="screen">
            <div class="app-title">Крок 1</div>
            <div class="app-sub">Ввід та Аналіз Бази</div>

            <div class="card">
                <span class="input-label">Опис товару</span>
                <textarea id="desc" placeholder="Наприклад: iPhone 13 128GB Blue"></textarea>
            </div>

            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="dz-text" id="dzText">Кинь фотку або <span>вибери</span></div>
                <div id="preview"></div>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFiles(this.files)">

            <div id="p1_results" style="display:none" class="fade">
                <div class="hero-priceHero" style="text-align:center; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 15px;">
                    <span class="input-label" style="color:#fff">Базова ціна (XGBoost)</span>
                    <div class="base-price" id="base_price_val">— ₴</div>
                </div>
                <div style="margin-top:20px;">
                    <span class="input-label">Топ аналогів</span>
                    <div id="analogs_list"></div>
                </div>
            </div>

            <button class="btn" id="btn_p1" onclick="startAnalysis()">Аналізувати</button>
        </div>
    </div>

    <div class="phone-frame hidden" id="phone2">
        <div class="island"></div>
        <div class="screen">
            <div class="app-title">Крок 2</div>
            <div class="app-sub">AI Vision & Interactive QA</div>

            <div class="card vision-res">
                <span class="input-label">Вердикт Gemini Vision</span>
                <div class="vision-score" id="vision_score_val">--%</div>
                <p class="vision-reason" id="vision_reason_val">Аналіз фото...</p>
            </div>

            <div style="margin-top:15px; flex:1;">
                <span class="input-label">Уточни деталі (QA)</span>
                
                <label class="dz-text">Стан акумулятора?</label>
                <select id="qa_battery">
                    <option value="1.0">Ідеальний (>90%)</option>
                    <option value="0.9">Нормальний (80-90%)</option>
                    <option value="0.8">Слабкий (<80%)</option>
                </select>

                <label class="dz-text">Подряпини на екрані?</label>
                <select id="qa_screen">
                    <option value="1.0">Відсутні (Ідеал)</option>
                    <option value="0.93">Мікро-царапини</option>
                    <option value="0.8">Глибокі подряпини</option>
                    <option value="0.6">Тріщина</option>
                </select>
                
                <label class="dz-text">Комплектація?</label>
                <select id="qa_kit">
                    <option value="1.0">Повний комплект</option>
                    <option value="0.97">Тільки телефон і кабель</option>
                    <option value="0.95">Тільки телефон</option>
                </select>
            </div>

            <button class="btn" id="btn_p2" onclick="finalizeAnalysis()">Фіналізувати</button>
        </div>
    </div>

    <div class="phone-frame hidden" id="phone3">
        <div class="island"></div>
        <div class="screen">
            <div class="app-title">Ітого</div>
            <div class="app-sub">Фінальна Оцінка</div>

            <div class="card" style="background: linear-gradient(145deg, #1a2e25, #16161a); border-color: #234d3a; padding: 25px;">
                <span class="input-label" style="color:var(--accent); text-align:center;">Рекомендована ціна</span>
                <div class="final-price" id="final_price_val">—<span style="font-size:24px; vertical-align:middle;"> ₴</span></div>
                <div style="font-size:10px; color:var(--muted); text-align:center;" id="final_formula">XGB * Vision * QA</div>
            </div>

            <div style="display:flex; gap:8px; margin-top:12px;">
                <div class="strat-card">
                    <div class="strat-name">⚡ Fast</div>
                    <div class="strat-val" id="strat_fast" style="color:var(--accent)">—</div>
                </div>
                <div class="strat-card">
                    <div class="strat-name">⚖️ Mid</div>
                    <div class="strat-val" id="strat_mid" style="color:var(--fast)">—</div>
                </div>
                <div class="strat-card">
                    <div class="strat-name">💎 Max</div>
                    <div class="strat-val" id="strat_max" style="color:var(--max)">—</div>
                </div>
            </div>
            
            <button class="btn" style="margin-top:30px; background:var(--surface); color:var(--muted)" onclick="location.reload()">Скинути</button>
        </div>
    </div>
</div>

<script>
    let selectedFile = null;
    let serverData = null; // Тут зберігаємо відповідь сервера

    // Стандартна обробка часу і Drag&Drop
    function updateTime() {
        const n = new Date();
        const timeStr = n.getHours().toString().padStart(2,'0') + ':' + n.getMinutes().toString().padStart(2,'0');
        document.querySelectorAll('.phone-frame').forEach(p => {
            // Можна додати реальний час у статус бар, якщо він є
        });
    }
    updateTime(); setInterval(updateTime, 10000);

    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = '#00ffa3'; });
    dz.addEventListener('dragleave', () => dz.style.borderColor = '#2d2d34');
    dz.addEventListener('drop', e => { e.preventDefault(); dz.style.borderColor = '#2d2d34'; handleFiles(e.dataTransfer.files); });

    function handleFiles(files) {
        if (files.length === 0) return;
        selectedFile = files[0];
        document.getElementById('dzText').style.display = 'none';
        const preview = document.getElementById('preview');
        preview.innerHTML = `<img src="${URL.createObjectURL(selectedFile)}" class="preview-img fade">`;
    }

    // КРОК 1: АНАЛІЗ БАЗИ ТА VISION
    async function startAnalysis() {
        const title = document.getElementById('desc').value.trim();
        if (!title || !selectedFile) { alert("Введіть опис і додайте фото, курва!"); return; }

        const btn = document.getElementById('btn_p1');
        const results1 = document.getElementById('p1_results');
        
        btn.disabled = true;
        btn.textContent = 'Думаємо...';
        results1.style.display = 'none';
        
        // Ховаємо 2 і 3 телефони, якщо вони були відкриті
        document.getElementById('phone2').classList.add('hidden');
        document.getElementById('phone3').classList.add('hidden');

        try {
            const form = new FormData();
            form.append('title', title);
            form.append('file', selectedFile);

            const res = await fetch('/analyze', { method: 'POST', body: form });
            serverData = await res.json();
            
            if (serverData.error) {
                alert(serverData.error); btn.disabled = false; btn.textContent = 'Аналізувати'; return;
            }

            // Рендеримо Перший телефон (чистий XGBoost)
            document.getElementById('base_price_val').textContent = fmt(serverData.prices.balanced) + ' ₴';
            renderAnalogs(serverData.analogs);
            results1.style.display = 'block';

            // Рендеримо Другий телефон (Vision від Gemini)
            document.getElementById('vision_score_val').textContent = Math.round(serverData.vision.coefficient * 100) + '%';
            document.getElementById('vision_reason_val').textContent = serverData.vision.reason;
            
            // Показуємо другий телефон
            document.getElementById('phone2').classList.remove('hidden');

        } catch(e) {
            alert("Сервер впав. Перевір консоль.");
        }
        
        btn.disabled = false;
        btn.textContent = 'Аналізувати знову';
    }

    // КРОК 2: ФІНАЛІЗАЦІЯ З QA
    function finalizeAnalysis() {
        if (!serverData) return;
        
        const btn = document.getElementById('btn_p2');
        btn.disabled = true;
        btn.textContent = 'Рахуємо QA...';

        // Витягуємо коефіцієнти з Interactive QA
        const k_battery = parseFloat(document.getElementById('qa_battery').value);
        const k_screen = parseFloat(document.getElementById('qa_screen').value);
        const k_kit = parseFloat(document.getElementById('qa_kit').value);

        // Синтез фінального коефіцієнта стану (C)
        // Формула: C = Gemini_Vision * Battery * Screen * Kit
        const vision_coeff = serverData.vision.coefficient;
        let final_condition_coeff = vision_coeff * k_battery * k_screen * k_kit;
        
        // Жорсткий Floor (стан не може бути менше 35%, навіть якщо все розбито)
        final_condition_coeff = Math.max(final_condition_coeff, 0.35);

        // Розрахунок фінальних цін (XGBoost * Final_Condition)
        const final_prices = {
            balanced: Math.round(serverData.prices.balanced * final_condition_coeff),
            fast: Math.round(serverData.prices.fast * final_condition_coeff),
            max: Math.round(serverData.prices.max * final_condition_coeff)
        };

        // Рендеримо Третій телефон
        document.getElementById('final_price_val').textContent = fmt(final_prices.balanced);
        document.getElementById('strat_fast').textContent = fmt(final_prices.fast);
        document.getElementById('strat_mid').textContent = fmt(final_prices.balanced);
        document.getElementById('strat_max').textContent = fmt(final_prices.max);
        
        const formulaStr = `XGB(${fmt(serverData.prices.balanced)}) * Vis(${Math.round(vision_coeff*100)}%) * QA(${Math.round(k_battery*k_screen*k_kit*100)}%)`;
        document.getElementById('final_formula').textContent = formulaStr;

        // Показуємо третій телефон
        document.getElementById('phone3').classList.remove('hidden');

        btn.disabled = false;
        btn.textContent = 'Оновити фінал';
    }

    function fmt(n) { return n ? Math.round(n).toLocaleString('uk-UA') : '—' }

    function renderAnalogs(analogs) {
        const list = document.getElementById('analogs_list');
        list.innerHTML = '';
        analogs.forEach(a => {
            list.innerHTML += `
                <div class="analog-item fade">
                    <div style="max-width:70%">${a.title}</div>
                    <div class="analog-p">${fmt(a.sold_price || a.original_price)} ₴</div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
