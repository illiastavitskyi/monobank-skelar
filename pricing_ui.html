<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monobazar — AI Pricing Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0b0e;
    --bg-card: #13141a;
    --bg-card-hover: #1a1b24;
    --bg-surface: #1c1d26;
    --accent-gold: #d4a853;
    --accent-gold-dim: #d4a85333;
    --accent-emerald: #34d399;
    --accent-rose: #f472b6;
    --accent-blue: #3b82f6;
    --text-primary: #eeeef0;
    --text-secondary: #a0a2b0;
    --text-muted: #8b8d9a;
    --border-subtle: #1f2130;
    --border-accent: #2a2c3e;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --font-display: 'Instrument Serif', Georgia, serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    background-image:
      radial-gradient(ellipse at 30% 20%, #1a1035 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, #0d1f2d 0%, transparent 60%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    padding: 20px;
  }

  /* Phone Frame */
  .phone-frame {
    width: 390px;
    height: 844px;
    background: var(--bg-deep);
    border-radius: 50px;
    border: 3px solid #2a2a3a;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 120px -40px rgba(212,168,83,0.1);
    animation: frameIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes frameIn {
    from { opacity: 0; transform: scale(0.92) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 34px;
    background: #000;
    border-radius: 0 0 22px 22px;
    z-index: 100;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 50;
  }

  .screen {
    height: calc(100% - 34px);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 0 100px;
    scroll-behavior: smooth;
  }
  .screen::-webkit-scrollbar { width: 0; }

  /* Header */
  .header {
    padding: 20px 24px 16px;
    animation: slideUp 0.5s 0.3s both;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent-gold), #b8860b);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .logo-text {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--text-primary);
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: white;
    border: 2px solid var(--border-accent);
  }

  .greeting {
    font-family: var(--font-display);
    font-size: 30px;
    color: var(--text-primary);
    line-height: 1.15;
    margin-bottom: 4px;
  }
  .greeting em { color: var(--accent-gold); font-style: italic; }
  .sub-greeting {
    color: var(--text-secondary);
    font-size: 13.5px;
    font-weight: 300;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Input Card */
  .input-card {
    margin: 0 24px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 20px;
    animation: slideUp 0.5s 0.45s both;
  }
  .input-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 8px;
    display: block;
  }
  .image-upload-area {
    width: 100%;
    height: 160px;
    background: var(--bg-surface);
    border: 2px dashed var(--border-subtle);
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 16px;
  }
  .image-upload-area:hover {
    border-color: var(--accent-gold);
    background: var(--bg-card-hover);
  }
  .image-preview {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    display: none;
  }
  .upload-icon {
    font-size: 32px;
    opacity: 0.5;
  }
  .upload-text {
    font-size: 12px;
    color: var(--text-muted);
  }
  textarea, select {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 13px;
    margin-bottom: 16px;
    resize: vertical;
  }
  textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent-gold);
  }
  .submit-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent-gold), #b8860b);
    border: none;
    border-radius: 14px;
    padding: 14px;
    color: #0a0b0e;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px var(--accent-gold-dim);
  }
  .submit-btn:disabled {
    opacity: 0.5;
    transform: none;
  }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 20px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border-subtle);
    border-top-color: var(--accent-gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results {
    display: none;
    padding: 0 24px;
  }

  /* Price Card */
  .price-card {
    background: linear-gradient(135deg, rgba(52,211,153,0.1), rgba(212,168,83,0.05));
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .price-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .price-value {
    font-family: var(--font-mono);
    font-size: 48px;
    font-weight: 600;
    color: var(--accent-emerald);
    margin-bottom: 8px;
  }
  .price-range {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Strategy Cards - FIXED LIGHT TEXT */
  .strategy-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 18px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .strategy-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
  }
  .strategy-card.green::before { background: var(--accent-emerald); }
  .strategy-card.blue::before { background: var(--accent-blue); }
  .strategy-card.amber::before { background: var(--accent-gold); }

  .strategy-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .strategy-emoji { font-size: 28px; }
  .strategy-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .strategy-prices {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .strategy-price-item {
    text-align: center;
  }
  .strategy-price-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .strategy-price-value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .strategy-explanation {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .strategy-advice {
    background: rgba(212,168,83,0.1);
    padding: 10px;
    border-radius: 10px;
    font-size: 11px;
    color: var(--accent-gold);
    font-style: italic;
  }

  /* Collapsible - FIXED LIGHT TEXT */
  .collapsible {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    margin-bottom: 12px;
  }
  .collapsible-header {
    padding: 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
    color: var(--text-primary);
  }
  .collapsible-header span:last-child {
    color: var(--text-muted);
  }
  .collapsible-content {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border-subtle);
  }
  .collapsible.open .collapsible-content { display: block; }

  .evidence-item {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 8px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .evidence-item:last-child {
    border-bottom: none;
  }

  .comparable-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 12px;
  }
  .comparable-item:last-child {
    border-bottom: none;
  }
  .comparable-title {
    color: var(--text-primary);
    font-weight: 400;
  }
  .comparable-price {
    color: var(--accent-emerald);
    font-family: var(--font-mono);
    font-weight: 500;
  }

  /* Section headers in results */
  .section-subtitle {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 16px 0 12px 0;
  }

  /* Bottom Nav */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 88px;
    background: linear-gradient(to top, var(--bg-deep) 70%, transparent);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding-top: 14px;
    z-index: 90;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 1.8;
  }
  .nav-item.active svg { stroke: var(--accent-gold); }
  .nav-item span {
    font-size: 9.5px;
    color: var(--text-muted);
  }
  .nav-item.active span { color: var(--accent-gold); }

  .home-bar {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: var(--text-muted);
    border-radius: 3px;
    opacity: 0.3;
    z-index: 100;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="notch"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">📶 🔋</div>
  </div>

  <div class="screen">
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-icon">•⩊•</div>
          <div class="logo-text">Monobazar</div>
        </div>
        <div class="avatar">AI</div>
      </div>
      <div class="greeting">AI <em>Pricing</em><br>Intelligence</div>
      <div class="sub-greeting">Upload & describe — get data-driven price recommendations</div>
    </div>

    <!-- Input Card -->
    <div class="input-card">
      <div class="input-label">📸 Product Photo</div>
      <div class="image-upload-area" id="uploadArea">
        <div class="upload-icon">📷</div>
        <div class="upload-text">Tap to upload photo</div>
      </div>
      <img id="imagePreview" class="image-preview">
      <input type="file" id="imageInput" accept="image/*" style="display:none">

      <div class="input-label">📝 Product Description</div>
      <textarea id="description" rows="3" placeholder="e.g., Nike Air Max 90, size 42, good condition, original box..."></textarea>

      <div class="input-label">🏷️ Category (optional)</div>
      <select id="category">
        <option value="">— Any category —</option>
        <option value="electronics">Electronics</option>
        <option value="clothing">Clothing</option>
        <option value="shoes">Shoes</option>
        <option value="furniture">Furniture</option>
      </select>

      <button class="submit-btn" id="submitBtn">✨ Get Price Recommendation</button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div style="color: var(--text-muted); font-size: 13px;">Analyzing market data...</div>
    </div>

    <!-- Results -->
    <div class="results" id="results">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span>Explore</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <span>Alerts</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </div>
  </div>
  <div class="home-bar"></div>
</div>

<script>
  // Image upload handling
  const uploadArea = document.getElementById('uploadArea');
  const imageInput = document.getElementById('imageInput');
  const imagePreview = document.getElementById('imagePreview');
  let currentImageFile = null;

  uploadArea.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      currentImageFile = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (event) => {
        imagePreview.src = event.target.result;
        imagePreview.style.display = 'block';
        uploadArea.style.display = 'none';
      };
      reader.readAsDataURL(currentImageFile);
    }
  });

  // Submit handler
  const submitBtn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  const resultsDiv = document.getElementById('results');

  submitBtn.addEventListener('click', async () => {
    const description = document.getElementById('description').value;
    const category = document.getElementById('category').value;

    if (!description.trim()) {
      alert('Please enter a product description');
      return;
    }
    if (!currentImageFile) {
      alert('Please upload a product photo');
      return;
    }

    // Show loading
    submitBtn.disabled = true;
    loading.style.display = 'block';
    resultsDiv.style.display = 'none';
    resultsDiv.innerHTML = '';

    // Prepare form data
    const formData = new FormData();
    formData.append('description', description);
    formData.append('category_id', category);
    formData.append('image', currentImageFile);

    try {
      const response = await fetch('/api/predict', {
        method: 'POST',
        body: formData
      });

      if (!response.ok) throw new Error('API error');

      const data = await response.json();
      displayResults(data);

    } catch (error) {
      console.error('Error:', error);
      resultsDiv.innerHTML = '<div class="price-card" style="color: var(--accent-rose);">❌ Error connecting to backend. Make sure your Python server is running.</div>';
      resultsDiv.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      loading.style.display = 'none';
    }
  });

  function displayResults(data) {
    resultsDiv.innerHTML = '';

    // Price Card
    const priceCard = document.createElement('div');
    priceCard.className = 'price-card';
    priceCard.innerHTML = `
      <div class="price-label">RECOMMENDED PRICE</div>
      <div class="price-value">₴${data.recommended_price.toLocaleString()}</div>
      <div class="price-range">Range: ₴${data.price_range[0].toLocaleString()} - ₴${data.price_range[1].toLocaleString()}</div>
      <div style="margin-top: 8px; font-size: 11px; color: var(--text-secondary);">${data.item_name}</div>
    `;
    resultsDiv.appendChild(priceCard);

    // Strategies section title
    const strategiesTitle = document.createElement('div');
    strategiesTitle.className = 'section-subtitle';
    strategiesTitle.textContent = '📊 Pricing Strategies';
    resultsDiv.appendChild(strategiesTitle);

    // Strategy Cards
    const strategyColors = ['green', 'blue', 'amber'];
    data.strategies.forEach((s, idx) => {
      const card = document.createElement('div');
      card.className = `strategy-card ${strategyColors[idx % 3]}`;
      card.innerHTML = `
        <div class="strategy-header">
          <div class="strategy-emoji">${s.emoji}</div>
          <div class="strategy-name">${s.name}</div>
        </div>
        <div class="strategy-prices">
          <div class="strategy-price-item">
            <div class="strategy-price-label">Sale Price</div>
            <div class="strategy-price-value">₴${s.price.toLocaleString()}</div>
          </div>
          <div class="strategy-price-item">
            <div class="strategy-price-label">List at</div>
            <div class="strategy-price-value">₴${s.listing_price.toLocaleString()}</div>
          </div>
          <div class="strategy-price-item">
            <div class="strategy-price-label">Probability</div>
            <div class="strategy-price-value">${Math.round(s.sale_probability * 100)}%</div>
          </div>
        </div>
        <div class="strategy-explanation">${s.explanation}</div>
        <div class="strategy-advice">💡 ${s.bargain_advice}</div>
      `;
      resultsDiv.appendChild(card);
    });

    // Collapsible: Assessment
    const assessment = document.createElement('div');
    assessment.className = 'collapsible';
    assessment.innerHTML = `
      <div class="collapsible-header">
        <span>📋 Product Assessment & Evidence</span>
        <span>▼</span>
      </div>
      <div class="collapsible-content">
        <div style="margin-bottom: 12px; color: var(--text-primary);"><strong>Condition:</strong> ${data.condition || 'Good'}</div>
        <div style="margin-bottom: 8px; color: var(--text-primary);"><strong>Evidence:</strong></div>
        ${data.evidence.map(e => `<div class="evidence-item">• ${e}</div>`).join('')}
      </div>
    `;
    resultsDiv.appendChild(assessment);

    // Collapsible: Comparables
    const comparables = document.createElement('div');
    comparables.className = 'collapsible';
    comparables.innerHTML = `
      <div class="collapsible-header">
        <span>🛍️ Similar Listings (${data.comparables.length})</span>
        <span>▼</span>
      </div>
      <div class="collapsible-content">
        ${data.comparables.map(c => `
          <div class="comparable-item">
            <span class="comparable-title">${c.title}</span>
            <span class="comparable-price">${c.price}</span>
          </div>
        `).join('')}
      </div>
    `;
    resultsDiv.appendChild(comparables);

    // Add collapsible toggle
    document.querySelectorAll('.collapsible-header').forEach(header => {
      header.addEventListener('click', () => {
        header.parentElement.classList.toggle('open');
      });
    });

    resultsDiv.style.display = 'block';
    resultsDiv.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
